<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>学校商品バーコード管理</title><script src="https://unpkg.com/html5-qrcode"></script><style>*{box-sizing:border-box}body{margin:0;padding:15px;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#333}.wrap{max-width:600px;margin:auto}h1{text-align:center;font-size:23px}.card{background:#fff;border-radius:16px;padding:18px;margin:18px 0;box-shadow:0 2px 8px #0001}.btn{width:100%;padding:16px;border:0;border-radius:12px;font-size:17px;font-weight:bold;background:#1976d2;color:#fff;margin-top:12px}.gray{background:#666}.red{background:#d32f2f}.status{text-align:center;padding:12px;line-height:1.6}#reader{width:100%;overflow:hidden;border-radius:12px}#reader video{width:100%!important;border-radius:12px}.row{border-bottom:1px solid #eee;padding:10px 0}.label{font-size:13px;color:#777}.value{font-size:18px;word-break:break-word}.jan{font-family:monospace;font-size:20px}.stock{font-size:24px;font-weight:bold}.error{background:#fff3f3;border:1px solid #e57373;border-radius:10px;padding:15px;white-space:pre-line;line-height:1.7}.center{text-align:center}.big{font-size:48px}</style></head><body><div class="wrap"><h1>📦 学校商品バーコード管理</h1><div class="card"><div id="home" class="center"><div class="big">📷</div><div class="status">カメラを起動してバーコードを読み取ります。</div><button class="btn" onclick="startCamera()">📷 カメラを起動</button><button class="btn gray" onclick="document.getElementById('file').click()">🖼️ 画像から読み取る</button><input id="file" type="file" accept="image/*" style="display:none" onchange="scanImage(this)"></div><div id="reader" style="display:none"></div><div id="status" class="status" style="display:none"></div><button id="stop" class="btn red" style="display:none" onclick="stopCamera()">⛔ カメラを停止</button></div><div id="result" style="display:none"></div></div><script>
const API_URL="ここにApps ScriptのウェブアプリURLを貼り付け";let qr=null,running=false,locked=false;
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
async function startCamera(){if(running)return;if(!API_URL.startsWith('https://'))return camError('API_URLを設定してください。');try{document.getElementById('home').style.display='none';document.getElementById('reader').style.display='block';document.getElementById('status').style.display='block';document.getElementById('stop').style.display='block';document.getElementById('status').textContent='📷 カメラを起動しています…';qr=new Html5Qrcode('reader');const cfg={fps:10,qrbox:(w,h)=>({width:Math.floor(w*.85),height:Math.min(Math.floor(w*.38),Math.floor(h*.5))}),formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8]};await qr.start({facingMode:'environment'},cfg,onScan,()=>{});running=true;document.getElementById('status').textContent='🔍 バーコードをかざしてください。'}catch(e){camError('カメラを起動できませんでした。

Chromeでカメラを許可してください。

詳細：'+(e.message||e))}}
async function stopCamera(){running=false;locked=false;if(qr){try{await qr.stop()}catch(e){}try{await qr.clear()}catch(e){}}location.reload()}
async function onScan(text){if(locked)return;locked=true;const jan=String(text).replace(/[^0-9]/g,'');if(qr){try{await qr.stop()}catch(e){}try{await qr.clear()}catch(e){}}running=false;document.getElementById('reader').style.display='none';document.getElementById('status').style.display='block';document.getElementById('status').textContent='🔎 商品を検索しています…';api('search',jan,showResult)}
function api(action,jan,fn){const cb='cb'+Date.now();window[cb]=d=>{delete window[cb];fn(d)};const s=document.createElement('script');s.src=API_URL+'?action='+encodeURIComponent(action)+'&jan='+encodeURIComponent(jan)+'&callback='+cb;s.onerror=()=>{delete window[cb];showError('Googleスプレッドシートへの接続に失敗しました。')};document.body.appendChild(s)}
function showResult(d){const r=document.getElementById('result');r.style.display='block';if(d.status==='error'){showError(d.message);return}if(d.status==='notfound'){r.innerHTML='<div class="card center"><h2>❓ 未登録商品</h2><div>JANコード</div><div class="jan">'+esc(d.jan)+'</div><div>'+esc(d.message)+'</div><button class="btn" onclick="api('registerUnknown',d.jan,()=>{document.getElementById('result').innerHTML='<div class=card><div class=center>✅ 未登録商品として記録しました。</div><button class=btn onclick=location.reload()>📷 次の商品</button></div>'})">📝 未登録商品として記録</button><button class="btn" onclick="location.reload()">📷 次の商品</button></div>';return}r.innerHTML='<div class="card"><h2>✅ 商品情報</h2>'+row('JANコード',d.jan,'jan')+row('商品名',d.name)+row('メーカー',d.maker)+row('規格・容量',d.specification)+row('保管場所',d.location)+row('在庫数',d.stock,'stock')+row('使用期限',d.expiration)+row('備考',d.note)+'<button class="btn" onclick="location.reload()">📷 次の商品</button></div>';locked=false}
function row(a,b,c=''){return '<div class="row"><div class="label">'+a+'</div><div class="value '+c+'">'+esc(b)+'</div></div>'}
function showError(m){const r=document.getElementById('result');r.style.display='block';r.innerHTML='<div class="card"><div class="error">⚠️ '+esc(m)+'</div><button class="btn" onclick="location.reload()">🔄 もう一度</button></div>'}
function camError(m){document.getElementById('home').style.display='block';document.getElementById('home').innerHTML='<div class="error">⚠️ カメラを起動できません

'+esc(m)+'</div><button class="btn" onclick="location.reload()">🔄 もう一度</button>'}
async function scanImage(input){if(!input.files?.length)return;try{const s=new Html5Qrcode('reader');const t=await s.scanFile(input.files[0],true);try{await s.clear()}catch(e){}api('search',String(t).replace(/[^0-9]/g,''),showResult)}catch(e){alert('画像からバーコードを読み取れませんでした。')}}
</script></body></html>
