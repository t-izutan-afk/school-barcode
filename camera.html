<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学校商品バーコード検索</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 20px;
    }

    h1 {
      font-size: 24px;
    }

    button {
      font-size: 20px;
      padding: 12px 24px;
      margin: 10px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      text-align: left;
      font-size: 18px;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>

<h1>📦 学校商品バーコード検索</h1>

<button onclick="startCamera()">📷 カメラを起動</button>

<div id="reader"></div>

<div id="result">
  バーコードを読み取ってください。
</div>

<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbxyHwcb1LTp-oEte5PBOe1cycldgodDFcBUAfE0jPrHwpciPRuWcQWfZm3nd7oBSOxFCA/exec';

let html5QrCode = null;


/* =========================
   カメラ開始
========================= */

function startCamera() {

  document.getElementById("result").innerHTML =
    "📷 カメラを起動しています…";

  html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(
    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: {
        width: 300,
        height: 150
      }
    },

    function(decodedText) {

      console.log("読み取り：" + decodedText);

      document.getElementById("result").innerHTML =
        "🔍 JANコード：" + decodedText +
        "<br>商品情報を検索しています…";

      searchProduct(decodedText);

    },

    function(errorMessage) {
      // 読み取り途中のエラーは無視
    }

  ).catch(function(err) {

    document.getElementById("result").innerHTML =
      "<p class='error'>❌ カメラを起動できませんでした。</p>" +
      "<p>" + err + "</p>";

  });
}


/* =========================
   Apps Script検索
   JSONP方式
========================= */

function searchProduct(jan) {

  const callbackName =
    "jsonpCallback_" + Date.now();

  const script = document.createElement("script");

  const url =
    API_URL +
    "?action=search" +
    "&jan=" + encodeURIComponent(jan) +
    "&callback=" + callbackName;

  window[callbackName] = function(data) {

    console.log("Apps Script応答：", data);

    if (data.success && data.status === "found") {

      document.getElementById("result").innerHTML =

        "<h2>✅ 商品が見つかりました</h2>" +

        "<p><b>JANコード：</b>" +
        escapeHtml(data.jan) +
        "</p>" +

        "<p><b>商品名：</b>" +
        escapeHtml(data.name) +
        "</p>" +

        "<p><b>メーカー：</b>" +
        escapeHtml(data.maker) +
        "</p>" +

        "<p><b>規格・容量：</b>" +
        escapeHtml(data.specification) +
        "</p>" +

        "<p><b>保管場所：</b>" +
        escapeHtml(data.location) +
        "</p>" +

        "<p><b>在庫数：</b>" +
        escapeHtml(data.stock) +
        "</p>" +

        "<p><b>使用期限：</b>" +
        escapeHtml(data.expiration) +
        "</p>" +

        "<p><b>備考：</b>" +
        escapeHtml(data.note) +
        "</p>";

    } else if (data.status === "notfound") {

      document.getElementById("result").innerHTML =

        "<h2>⚠️ 商品が登録されていません</h2>" +

        "<p>JANコード：</p>" +

        "<p><b>" +
        escapeHtml(jan) +
        "</b></p>" +

        "<button onclick=\"registerUnknown('" +
        escapeHtml(jan) +
        "')\">" +
        "未登録商品として記録" +
        "</button>";

    } else {

      document.getElementById("result").innerHTML =
        "<p class='error'>❌ " +
        escapeHtml(data.message || "検索エラー") +
        "</p>";
    }

    delete window[callbackName];
    script.remove();
  };

  window[callbackName].error = function() {

    document.getElementById("result").innerHTML =
      "<p class='error'>❌ Apps Scriptに接続できません。</p>";

    delete window[callbackName];
    script.remove();
  };

  script.src = url;

  document.body.appendChild(script);
}


/* =========================
   未登録JANを記録
========================= */

function registerUnknown(jan) {

  const callbackName =
    "jsonpRegister_" + Date.now();

  const script = document.createElement("script");

  const url =
    API_URL +
    "?action=registerUnknown" +
    "&jan=" + encodeURIComponent(jan) +
    "&callback=" + callbackName;

  window[callbackName] = function(data) {

    if (data.success) {

      document.getElementById("result").innerHTML =
        "<h2>✅ 記録しました</h2>" +
        "<p>JANコード：" +
        escapeHtml(jan) +
        "</p>";

    } else {

      document.getElementById("result").innerHTML =
        "<p class='error'>❌ " +
        escapeHtml(data.message || "登録エラー") +
        "</p>";
    }

    delete window[callbackName];
    script.remove();
  };

  script.src = url;

  document.body.appendChild(script);
}


/* =========================
   HTML特殊文字対策
========================= */

function escapeHtml(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
